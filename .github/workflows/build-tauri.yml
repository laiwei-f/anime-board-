name: Build Tauri Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare frontend and round icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "追番养肥看板_优化版11.html" -Destination "dist/index.html"

          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path "app-icon.png"))
          $size = [Math]::Min($src.Width, $src.Height)
          $dst = New-Object System.Drawing.Bitmap($size, $size, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($dst)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.Clear([System.Drawing.Color]::Transparent)

          $r = [int]($size * 0.22)
          $d = $r * 2
          $path = New-Object System.Drawing.Drawing2D.GraphicsPath
          $path.AddArc(0, 0, $d, $d, 180, 90)
          $path.AddArc($size - $d, 0, $d, $d, 270, 90)
          $path.AddArc($size - $d, $size - $d, $d, $d, 0, 90)
          $path.AddArc(0, $size - $d, $d, $d, 90, 90)
          $path.CloseFigure()

          $g.SetClip($path)
          $g.DrawImage($src, 0, 0, $size, $size)
          $src.Dispose()
          $g.Dispose()
          $dst.Save("app-icon-rounded.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $dst.Dispose()
          Move-Item -Force "app-icon-rounded.png" "app-icon.png"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies, generate icon and build
        run: |
          npm install
          npx tauri icon app-icon.png
          npm run tauri build

      - name: Upload Tauri Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-Pro-Portable-EXE
          path: src-tauri/target/release/anime-shelf-pro.exe
