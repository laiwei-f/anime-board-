name: Build Tauri Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare frontend dist
        run: |
          mkdir dist
          Copy-Item "追番养肥看板_优化版11.html" -Destination "dist/index.html"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies and build Tauri
        run: |
          npm install
          npm run tauri build

      - name: Upload Tauri Installer
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShelf-Pro-Tauri-Win
          path: src-tauri/target/release/bundle/nsis/*.exe
